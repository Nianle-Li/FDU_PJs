experiment_name: classification
experiment_dir: experiments/classification
seed: 42
task: classification

data:
  data_dir: train_data_update_03-31_v2/train
  val_split: 0.1
  invert: true
  augmentation: true
  aug_shift_range: 2

model:
  layers: [784, 512, 256, 12]
  activations: [relu, relu]
  output_activation: linear
  dropout_rates: [0.2, 0.1]

train:
  batch_size: 64
  epochs: 500
  lr: 0.01
  momentum: 0.9
  weight_decay: 5.0e-05
  label_smoothing: 0.0
  lr_schedule:
    enabled: true
    type: cosine
    lr_min: 0.0001
  early_stopping:
    enabled: true
    patience: 60
