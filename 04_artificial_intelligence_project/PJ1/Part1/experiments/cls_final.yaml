task: classification
seed: 42
experiment_dir: experiments/cls_final

model:
  layers: [784, 512, 256, 12]
  activations: ["relu", "relu"]
  output_activation: "linear"
  dropout_rates: [0.2, 0.1]

data:
  data_dir: train_data_update_03-31_v2/train
  val_split: 0.0
  invert: true
  augmentation: true
  aug_shift_range: 2

train:
  batch_size: 64
  epochs: 186
  lr: 0.01
  momentum: 0.9
  weight_decay: 0.00005
  label_smoothing: 0.0
  lr_schedule:
    enabled: true
    type: cosine
    lr_min: 0.0001
  early_stopping:
    enabled: false
    patience: 60
