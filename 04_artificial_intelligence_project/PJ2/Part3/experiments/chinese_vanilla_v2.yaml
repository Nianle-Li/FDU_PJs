lang: zh
data_dir: ../NER/Chinese
output_dir: outputs/chinese_vanilla_v2

# Round 4 (另一台机器) - 中文 Vanilla 延长训练 + 优化超参
# v1 在 epoch 25 早停(F1=0.8985)，学习率较高可能震荡
# v2 降低 LR，更长 warmup，增大 patience，争取突破 0.91

model:
  encoder: vanilla
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  ff_dim: 1024
  dropout: 0.1
  max_len: 512

training:
  batch_size: 64
  epochs: 150
  lr: 5.0e-4              # v1 lr=1e-3，降低一半减少震荡
  lr_scheduler: cosine
  warmup_steps: 600       # 更长 warmup 稳定初期训练
  clip_grad: 1.0
  weight_decay: 0.01
  early_stopping_patience: 20   # v1 patience=10，扩大避免过早停止

crf:
  use_constraint: true
