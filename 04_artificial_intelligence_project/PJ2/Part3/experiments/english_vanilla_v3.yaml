lang: en
data_dir: ../NER/English
output_dir: outputs/english_vanilla_v3

model:
  encoder: vanilla
  embed_dim: 256
  num_heads: 8
  num_layers: 4
  ff_dim: 1024
  dropout: 0.1
  max_len: 512
  min_freq: 2           # v1/v2 min_freq=1 保留所有单词，大量低频词干扰泛化
                        # min_freq=2 过滤单现词，vocab 更紧凑，UNK 泛化更好

training:
  batch_size: 64
  epochs: 100
  lr: 1.0e-3
  lr_scheduler: cosine
  warmup_steps: 400
  clip_grad: 1.0
  weight_decay: 0.01
  early_stopping_patience: 15

crf:
  use_constraint: true
