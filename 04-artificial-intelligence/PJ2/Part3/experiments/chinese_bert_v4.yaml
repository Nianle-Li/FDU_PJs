lang: zh
data_dir: ../NER/Chinese
output_dir: outputs/chinese_bert_v4

# Round 5 - 中文 BERT 稳定版（回归最优设置 + 更长训练）
# 分析：
#   v1 (head_lr=2e-4, patience=5) → F1=0.9677 @epoch16（最优）
#   v2 (head_lr=3e-4, patience=10) → F1=0.9664，epoch15 出现 loss 突刺（不稳定）
#   结论：head_lr=3e-4 过激，回到 head_lr=2e-4
#   改进：patience 扩大到 15，epochs=60，让模型有更多机会超越 0.9677

model:
  encoder: bert
  bert_model: bert-base-chinese
  dropout: 0.1
  max_len: 512

training:
  batch_size: 32
  epochs: 60
  lr: 2.0e-5              # 保持 v1 稳定设置
  head_lr: 2.0e-4         # 回到 v1 的 2e-4，v2 的 3e-4 导致 loss spike
  lr_scheduler: cosine
  warmup_steps: 300
  clip_grad: 1.0
  weight_decay: 0.01
  early_stopping_patience: 15   # v1 patience=5 太早，给足训练空间

crf:
  use_constraint: true
