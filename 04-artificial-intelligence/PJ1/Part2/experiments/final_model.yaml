experiment_name: final_model
experiment_dir: experiments/final_model
seed: 42
task: classification

data:
  data_dir: train_data_update_03-31_v2/train
  val_split: 0.0
  invert: true

model:
  num_classes: 12
  downsample_mode: maxpool
  use_se: false
  dropout: 0.4

augment:
  shift: 3
  random_erasing: true
  random_erasing_p: 0.3
  random_erasing_scale: [0.02, 0.15]
  affine: false
  mixup_alpha: 0.2

train:
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 5.0e-5
  batch_size: 64
  epochs: 45
  label_smoothing: 0.0
  use_ema: false
  lr_schedule:
    enabled: true
    type: cosine
    lr_min: 1.0e-5
  early_stopping:
    enabled: false
    patience: 0
